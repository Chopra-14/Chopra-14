<svg width="1200" height="180" viewBox="0 0 1200 180" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1.5; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #64748B; }
      .value { font-family: 'Segoe UI', Arial, sans-serif; font-size: 34px; font-weight: 800; }
      .delta { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; }
    </style>
  </defs>
  <rect width="1200" height="180" fill="#F8FAFC"/>

  <rect x="10"  y="10" width="380" height="160" rx="14" class="card"/>
  <rect x="410" y="10" width="380" height="160" rx="14" class="card"/>
  <rect x="810" y="10" width="380" height="160" rx="14" class="card"/>

  <rect x="10"  y="10" width="6" height="160" rx="3" fill="#F97316"/>
  <rect x="410" y="10" width="6" height="160" rx="3" fill="#10B981"/>
  <rect x="810" y="10" width="6" height="160" rx="3" fill="#0F172A"/>

  <text x="40" y="50" class="label">REPORTING TIME CUT</text>
  <text x="40" y="95" class="value" fill="#F97316">30%</text>
  <text x="40" y="125" class="delta" fill="#94A3B8">Technical Hub internship</text>

  <text x="440" y="50" class="label">RECORDS ANALYZED</text>
  <text x="440" y="95" class="value" fill="#10B981">5,000+</text>
  <text x="440" y="125" class="delta" fill="#94A3B8">Single project dataset</text>

  <text x="840" y="50" class="label">GITHUB REPOS</text>
  <text x="840" y="95" class="value" fill="#0F172A">60+</text>
  <text x="840" y="125" class="delta" fill="#94A3B8">AI, analytics, full-stack</text>
</svg>
