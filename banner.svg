<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2F7"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accentBar)"/>

  <!-- top bar: window chrome, dashboard feel -->
  <circle cx="34" cy="34" r="6" fill="#F97316"/>
  <circle cx="56" cy="34" r="6" fill="#0EA5E9"/>
  <circle cx="78" cy="34" r="6" fill="#10B981"/>
  <text x="1166" y="39" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8" text-anchor="end">dashboard.sathvika &#183; live</text>
  <circle cx="1176" cy="34" r="4" fill="#10B981">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- name -->
  <text x="60" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="800" fill="#0F172A">
    Sathvika Konakalla
  </text>
  <text x="60" y="178" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" fill="#475569">
    Data Analyst &#183; AI/ML Undergraduate
  </text>
  <text x="60" y="206" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#94A3B8">
    Turning raw data into decisions that move the needle
  </text>

  <!-- mini bar chart illustration, right side -->
  <g transform="translate(880,110)">
    <rect x="0"  y="90" width="26" height="0" rx="4" fill="#0EA5E9"><animate attributeName="height" values="0;60" dur="1.2s" fill="freeze"/><animate attributeName="y" values="90;30" dur="1.2s" fill="freeze"/></rect>
    <rect x="36" y="90" width="26" height="0" rx="4" fill="#F97316"><animate attributeName="height" values="0;90" dur="1.2s" begin="0.15s" fill="freeze"/><animate attributeName="y" values="90;0" dur="1.2s" begin="0.15s" fill="freeze"/></rect>
    <rect x="72" y="90" width="26" height="0" rx="4" fill="#10B981"><animate attributeName="height" values="0;45" dur="1.2s" begin="0.3s" fill="freeze"/><animate attributeName="y" values="90;45" dur="1.2s" begin="0.3s" fill="freeze"/></rect>
    <rect x="108" y="90" width="26" height="0" rx="4" fill="#0F172A"><animate attributeName="height" values="0;70" dur="1.2s" begin="0.45s" fill="freeze"/><animate attributeName="y" values="90;20" dur="1.2s" begin="0.45s" fill="freeze"/></rect>
    <rect x="144" y="90" width="26" height="0" rx="4" fill="#0EA5E9"><animate attributeName="height" values="0;35" dur="1.2s" begin="0.6s" fill="freeze"/><animate attributeName="y" values="90;55" dur="1.2s" begin="0.6s" fill="freeze"/></rect>
    <rect x="180" y="90" width="26" height="0" rx="4" fill="#F97316"><animate attributeName="height" values="0;80" dur="1.2s" begin="0.75s" fill="freeze"/><animate attributeName="y" values="90;10" dur="1.2s" begin="0.75s" fill="freeze"/></rect>
    <line x1="-10" y1="90" x2="216" y2="90" stroke="#CBD5E1" stroke-width="2"/>
  </g>
</svg>
